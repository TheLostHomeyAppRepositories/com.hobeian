name: Publish Homey App
on:
  workflow_dispatch:
    inputs:
      test_build_id:
        description: 'Existing build ID to activate on the test channel (skip upload)'
        required: false
        default: ''

jobs:
  main:
    name: Publish Homey App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish Homey App
        if: inputs.test_build_id == ''
        uses: athombv/github-action-homey-app-publish@master
        id: publish
        with:
          personal_access_token: ${{ secrets.HOMEY_PAT }}

      - name: URL
        if: inputs.test_build_id == ''
        run: |
          echo "Manage your app at ${{ steps.publish.outputs.url }}." >> $GITHUB_STEP_SUMMARY

      - uses: actions/setup-node@v4
        if: inputs.test_build_id != ''
        with:
          node-version: '20'

      - name: Activate existing build on test channel
        if: inputs.test_build_id != ''
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          HOMEY_HEADLESS: '1'
          HOMEY_TEST_BUILD_ID: ${{ inputs.test_build_id }}
        run: |
          npm install --no-save --package-lock=false --ignore-scripts homey@4.6.0
          node scripts/activate-test-build.cjs
